<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Group with 40 degree clockwise rotation -->
  <g transform="rotate(40 256 256)">
    <!-- White square with rounded corners -->
    <rect x="64" y="64" width="384" height="384" rx="64" ry="64" fill="white"/>
    
    <!-- Left triangle pointing right (base at left edge) -->
    <path d="M128 192 L128 320 L224 256 L128 192 Z" fill="#511076"/>
    
    <!-- Right triangle pointing left (base at right edge) -->
    <path d="M384 320 L384 192 L288 256 L384 320 Z" fill="#511076"/>
  </g>
</svg>
